  - boot_disk_size: null
    configuration:
      - name: iosxe_config.txt
        content: |-
          enable
          configure terminal
          hostname HQ-Router

          ! --- 1. إصلاح الواجهات الأساسية ---
          interface GigabitEthernet1
           description Link-to-Server1-WAN
           ip address 10.0.0.1 255.255.255.0
           no shutdown
           exit
          !
          interface GigabitEthernet2
           description Link-to-SW1-LAN
           ip address 192.168.1.1 255.255.255.0
           no shutdown
           exit

          ! --- 2. التصنيف (Classification) ---
          class-map match-all VOICE-CLASS
           match ip dscp ef
          !
          ip access-list extended DATA-TRAFFIC
           permit tcp any any eq 80
           permit tcp any any eq 443
           permit tcp any any eq 5201
          !
          class-map match-any DATA-CLASS
           match access-group name DATA-TRAFFIC

          ! --- 3. تحديد السياسة (Policy-Map) ---
          policy-map QOS-EDGE-POLICY
           class VOICE-CLASS
            priority 512
           class DATA-CLASS
            bandwidth percent 30
            set dscp af21
           class class-default
            fair-queue
          exit

          ! --- 4. التطبيق الصحيح على منفذ الـ WAN (GigabitEthernet1) ---
          interface GigabitEthernet1
           service-policy output QOS-EDGE-POLICY
           shape average 2000000
          exit

          end
          write memory
    cpu_limit: null
